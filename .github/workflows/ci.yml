name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 语法检查（node --check）
        run: npm run check

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 依赖含 onnxruntime / fastembed / sherpa-onnx 等大包：本地实测全量安装 30s（94MB，含
      # crcmod / qcloud-python-sts 两个 sdist 编译），在 3 分钟预算内，因此直接装完整依赖后跑
      # 真实 pytest（136 例），不降级为 compileall。
      - name: 安装后端依赖
        run: pip install -r server/requirements-dev.txt

      - name: 后端单测（pytest）
        run: python -m pytest server/tests
